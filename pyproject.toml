[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-trade"
version = "0.1.0"
description = "Local-first financial research and MT5 demo-trading foundation."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "pyarrow>=15.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "openbb>=4.0.0",
    "vnpy",
    "pyqlib",
    "PyYAML>=6.0",
    "tenacity>=8.2",
    "prometheus-client>=0.20.0",
    "faiss-cpu>=1.14.3",
    "ta",
    "scikit-learn>=1.3.0",
    "pytest-cov>=7.1.0",
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
    "finrl>=0.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pyright>=1.1.411",
]
